<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login | ExamGuard</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/common.css') }}">

<link rel="stylesheet"
href="{{ url_for('static', filename='css/login.css') }}">

</head>

<body>

<div class="login-page">

<div class="login-box">

<h1>Welcome Back</h1>

<p>Candidate Login</p>

{% with messages = get_flashed_messages() %}
{% if messages %}
{% for message in messages %}

<div class="flash">

{{message}}

</div>

{% endfor %}
{% endif %}
{% endwith %}

<form method="POST">

<div class="form-group">

<label>Email</label>

<input
type="email"
name="email"
placeholder="Enter Email"
required>

</div>

<div class="form-group">

<label>Password</label>

<input
type="password"
name="password"
placeholder="Enter Password"
required>

</div>

<button
class="btn login-btn">

Login

</button>

</form>

<div class="extra-links">

<a href="/register">

Create Account

</a>

<a href="#">

Forgot Password?</a>

</div>

</div>

</div>

</body>

</html>
